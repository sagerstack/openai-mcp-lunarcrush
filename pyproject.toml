[tool.poetry]
name = "openai-mcp-lunarcrush"
version = "0.1.0"
description = ""
authors = ["Sagar Pratap Singh <sagarpratapsingh15@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.9.2,<4.0"
openai = "^2.6.1"
python-dotenv = "^1.2.1"
openai-agents = "^0.4.2"
requests = "^2.31.0"
boto3 = "^1.34.0"
structlog = "^23.1.0"
testcontainers = "^4.13.2"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-asyncio = "^0.21.0"
moto = {extras = ["s3"], version = "^4.2.0"}
responses = "^0.24.0"

[tool.poetry.group.integration.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-asyncio = "^0.21.0"
moto = {extras = ["s3"], version = "^4.2.0"}
responses = "^0.24.0"
localstack = "^2.0.0"
docker = "^6.0.0"
pytest-xdist = "^3.0.0"
pytest-timeout = "^2.1.0"

[tool.poetry.group.e2e.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-asyncio = "^0.21.0"
moto = {extras = ["s3"], version = "^4.2.0"}
responses = "^0.24.0"
localstack = "^2.0.0"
docker = "^6.0.0"
pytest-xdist = "^3.0.0"
pytest-timeout = "^2.1.0"
boto3 = "^1.34.0"
botocore = "^1.34.0"
requests = "^2.31.0"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=90",
    "-ra"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests requiring Docker environment",
    "docker: marks tests that require Docker containers",
    "performance: marks tests that measure performance",
    "slow: marks tests as slow running",
    "network: marks tests that require network access"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
